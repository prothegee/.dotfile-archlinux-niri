[window]
opacity = 0.90 # 0.93
padding = { x = 6, y = 6 }

[font]
size = 12.0 # 10/11; norm is 12

[font.normal]
family = "FiraMono Nerd Font"
style = "Regular"

[font.bold]
family = "FiraMono Nerd Font"
style = "Bold"

[font.italic]
family = "FiraMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "FiraMono Nerd Font"
style = "Bold Italic"

[colors]
primary = { foreground = "#848484" }
# primary = { foreground = "#c6c6c6", background = "#282c34" }
# primary = { foreground = "#c6c6c6", background = "#131418" }

[mouse]
hide_when_typing = true

# [cursor]
# blink_interval = 600
# blink_timeout = 0
# smooth_motion = true
# smooth_motion_factor = 0.2
# smooth_motion_spring = 0.5
# smooth_motion_max_stretch_x = 3.0
# smooth_motion_max_stretch_y = 3.0
# smooth_motion_antijitter_ms = 50

[cursor.style]
blinking = "On" # On | Off | Always


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
